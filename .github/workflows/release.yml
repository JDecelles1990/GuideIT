name: Release GuideIT Master (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip pytest during manual build"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-windows-desktop.yml
    with:
      python_version: "3.12"
      skip_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests || false }}
      artifact_name: "GuideIT_Master-win64"

  publish-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: GuideIT_Master-win64
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
