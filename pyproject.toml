[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guideit-master"
version = "1.0.0"
description = "Unified offline MSP troubleshooting playbook library and PowerShell script workstation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8.0",
    "shiboken6>=6.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0",
]

[project.scripts]
guideit-master = "guideit_master.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
